name: Release APK

# Tagging is the trigger: `git tag v1.2.3 && git push origin v1.2.3` builds a
# signed APK and attaches it to a GitHub Release of the same name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.2.3). No release is published.'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: write        # needed to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so versionCode can count commits

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="${{ github.event.inputs.version }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Monotonic and reproducible: total commits reachable from this ref.
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set - the APK would be unsigned."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PappVersionName='${{ steps.ver.outputs.name }}' \
            -PappVersionCode='${{ steps.ver.outputs.code }}'

      - name: Confirm the APK is actually signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$APKSIGNER" verify --print-certs "$APK"
          NAME='${{ github.event.repository.name }}-${{ steps.ver.outputs.name }}.apk'
          mv "$APK" "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
